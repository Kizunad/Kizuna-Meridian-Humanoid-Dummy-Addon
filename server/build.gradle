description = '训练假人击打报告、重置计划与档位的纯 Java 规则。'

dependencies {
    api project(':shared')
    // Framework 快照与 Threatening 档位由必装宿主在运行时提供，这里只编译引用。
    compileOnly files(rootProject.file(siblingArtifacts.frameworkServer))
    compileOnly files(rootProject.file(siblingArtifacts.humanoidServer))
    testImplementation files(rootProject.file(siblingArtifacts.frameworkServer))
    testImplementation files(rootProject.file(siblingArtifacts.humanoidServer))
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}
