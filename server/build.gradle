description = '训练假人击打报告的纯 Java 规则。'

dependencies {
    api project(':shared')
    // Framework 快照由必装宿主在运行时提供，这里只编译引用。
    // Framework 在 settings 中以源码组合，与原先读单个 JAR 一致只取模块本身。
    compileOnly('local.meridian:server') { transitive = false }
    testImplementation('local.meridian:server') { transitive = false }
    testImplementation libs.junit4
}

test {
    useJUnit()
}
